<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.35; }
    .pulse-glow {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { opacity: 0.35; transform: scale(0.98); }
      100% { opacity: 0.75; transform: scale(1.02); }
    }
    .flow-dash {
      stroke-dasharray: 8 12;
      animation: flow 20s linear infinite;
    }
    @keyframes flow {
      from { stroke-dashoffset: 400; }
      to { stroke-dashoffset: 0; }
    }
    .token-particle {
      animation: floatParticle 6s ease-in-out infinite alternate;
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-12px) translateX(15px); opacity: 0.3; }
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="320" rx="16" class="bg" />

  <!-- Subtle Perspective Grid -->
  <g class="grid-line">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="150" y1="0" x2="150" y2="320" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="450" y1="0" x2="450" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="750" y1="0" x2="750" y2="320" />
    <line x1="900" y1="0" x2="900" y2="320" />
    <line x1="1050" y1="0" x2="1050" y2="320" />
  </g>

  <!-- Animated Background Orbs / Halos -->
  <circle cx="200" cy="160" r="140" fill="#06b6d4" opacity="0.12" filter="url(#glow)" class="pulse-glow" />
  <circle cx="1000" cy="160" r="160" fill="#8b5cf6" opacity="0.14" filter="url(#glow)" class="pulse-glow" style="animation-delay: -2s;" />

  <!-- Animated Pipeline Data Flow Stream (Behind Text) -->
  <path d="M -50 250 C 250 220, 400 270, 600 240 C 800 210, 950 260, 1250 230" stroke="url(#wireGrad)" stroke-width="2.5" fill="none" class="flow-dash" />
  <path d="M -50 70 C 200 110, 450 60, 650 90 C 850 120, 1050 70, 1250 100" stroke="url(#wireGrad)" stroke-width="2" fill="none" class="flow-dash" style="animation-duration: 25s; animation-direction: reverse;" />

  <!-- Floating Cache & Inference Compute Nodes (Background Elements) -->
  <g class="token-particle" style="animation-delay: 0s;">
    <rect x="80" y="80" width="70" height="24" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1" opacity="0.6"/>
    <text x="115" y="96" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">PagedKV</text>
  </g>
  <g class="token-particle" style="animation-delay: -1.5s;">
    <rect x="1030" y="70" width="90" height="24" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1" opacity="0.6"/>
    <text x="1075" y="86" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">RadixAttention</text>
  </g>
  <g class="token-particle" style="animation-delay: -3s;">
    <rect x="100" y="220" width="85" height="24" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
    <text x="142" y="236" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Continuous Batch</text>
  </g>
  <g class="token-particle" style="animation-delay: -4.5s;">
    <rect x="1010" y="225" width="110" height="24" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" opacity="0.6"/>
    <text x="1065" y="241" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Prefill / Decode Split</text>
  </g>

  <!-- High-Precision Foreground Typography -->
  <g transform="translate(600, 100)">
    <!-- Category Badge -->
    <rect x="-140" y="-45" width="280" height="28" rx="14" fill="#0f172a" stroke="url(#cyanPurpleGrad)" stroke-width="1.5" />
    <circle cx="-115" cy="-31" r="4" fill="#06b6d4" filter="url(#softGlow)" />
    <text x="5" y="-31" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8" text-anchor="middle">HIGH-PERFORMANCE INFERENCE</text>
    
    <!-- Title -->
    <text x="0" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" text-anchor="middle">
      Production Inference Engines
    </text>

    <!-- Subtitle Gradient Text -->
    <text x="0" y="65" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="0.2" text-anchor="middle">
      LLM Serving • KV Cache Optimization • Prefill/Decode Disaggregation
    </text>

    <!-- Detail Description -->
    <text x="0" y="100" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" letter-spacing="0.4" text-anchor="middle">
      Continuous Batching • Speculative Decoding • Blackwell &amp; Hopper Runtimes • Enterprise Benchmarks
    </text>
  </g>

  <!-- Border Highlight -->
  <rect x="0.5" y="0.5" width="1199" height="319" rx="15.5" stroke="url(#cyanPurpleGrad)" stroke-width="1" stroke-opacity="0.35" />
</svg>
